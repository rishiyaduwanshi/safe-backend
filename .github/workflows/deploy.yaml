name: Auto Pull on Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            cd ~/safeindia

            DEPLOY_KEY="$HOME/.ssh/github_deploy"
            if [ ! -f "$DEPLOY_KEY" ]; then
              echo "Missing deploy key file: $DEPLOY_KEY"
              exit 1
            fi

            export GIT_SSH_COMMAND="ssh -i $DEPLOY_KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            if ! command -v bun >/dev/null 2>&1; then
              echo "bun is required on server for deploy"
              exit 1
            fi

            bun install --frozen-lockfile
            bun run build

            if command -v pm2 >/dev/null 2>&1; then
              if pm2 describe safe-backend >/dev/null 2>&1; then
                pm2 restart safe-backend --update-env
              else
                pm2 start bun --name safe-backend -- run pro
              fi
              pm2 save
            else
              mkdir -p logs
              pkill -f "bun run dist/server.js" || true
              nohup bun run pro > logs/prod.out 2>&1 < /dev/null &
            fi