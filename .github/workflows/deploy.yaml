name: Auto Pull on Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to server (run deploy.sh)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 10m
          script: |
            set -e
            APP_DIR="$HOME/safeindia"
            cd "$APP_DIR"

            # Ensure latest code is present (so deploy.sh exists)
            if [ ! -d .git ]; then
              echo "ERROR: $APP_DIR is not a git repo (.git missing). Clone the repo here once."
              exit 1
            fi
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # In case deploy.sh was pushed from Windows with CRLF
            sed -i 's/\r$//' deploy.sh || true
            chmod +x deploy.sh
            ./deploy.sh